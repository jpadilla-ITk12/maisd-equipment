<!DOCTYPE html>
<html lang="en"><head>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<script src="./config.js"></script>
<script src="./api-client.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>iPad Screen Work Request · Muskegon ISD</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#203c3b;background:#f3f7f6;font-size:16px;color-scheme:light}
*{box-sizing:border-box}body{margin:0}main{max-width:736px;margin:40px auto;padding:0 20px 36px}
.card{background:#fff;border:1px solid #dce6e2;border-radius:16px;padding:28px;margin-bottom:18px;box-shadow:0 3px 14px rgba(24,63,53,.035)}
.form-header{position:relative;overflow:hidden;padding:32px 30px 24px}.form-header:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:#187b69}
.heading-row{display:flex;align-items:center;gap:18px}.form-icon{display:flex;align-items:center;justify-content:center;flex:none;width:52px;height:60px;border:1px solid #d3e8df;border-radius:14px;background:#edf6f1;color:#18745f}.form-icon svg{width:28px;height:34px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:#55776f;margin:0 0 8px}
h1{font-size:29px;font-weight:650;letter-spacing:-.035em;line-height:1.2;margin:0;color:#193c34}h2{font-size:17px;font-weight:650;letter-spacing:-.015em;margin:0;color:#214b40}
.header-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-top:24px;padding-top:18px;border-top:1px solid #e8eeeb}.identity{font-size:13px;line-height:1.5;color:#596c65;margin:0;overflow-wrap:anywhere}.location{font-size:12px;font-weight:650;line-height:1.5;color:#276452;background:#eef6f1;border:1px solid #dbeae2;padding:5px 10px;border-radius:6px;margin:0}
.required-note{font-size:12px;color:#687a73;margin:0 4px 12px;text-align:right}.required{color:#aa3944}.optional{font-size:12px;font-weight:400;color:#6b7974;margin-left:3px}.hint{font-size:14px;line-height:1.6;color:#5c6d66;margin:12px 0 0}
.question-group{padding:26px 28px 28px;display:grid;gap:23px}.section-heading{padding-bottom:16px;border-bottom:1px solid #e6ede9}.field{min-width:0}label{display:block;font-size:14px;font-weight:600;line-height:1.5;margin-bottom:9px;color:#2b433b}
input,select,textarea{display:block;font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px 14px;border:1px solid #becfc7;border-radius:8px;background:#fbfdfc;color:#253e34;box-shadow:inset 0 1px 2px rgba(22,51,41,.025);transition:border-color .15s,box-shadow .15s}input[type=date]{max-width:260px}textarea{min-height:110px;line-height:1.6;resize:vertical}input:hover,select:hover,textarea:hover{border-color:#8fae9f}input:focus,select:focus,textarea:focus{outline:none;border-color:#187b69;background:#fff;box-shadow:0 0 0 3px rgba(24,123,105,.13)}
button:focus-visible,a:focus-visible{outline:3px solid #80baaa;outline-offset:3px}.buttons{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}.submit-row{justify-content:flex-end;margin-top:22px}button{font:inherit;font-size:14px;font-weight:650;cursor:pointer;padding:13px 23px;min-height:48px;border-radius:9px;border:1px solid #bdd0c6;background:#fff;color:#28614d;transition:background .15s,box-shadow .15s}button:hover{background:#f2f7f4}button.primary{min-width:156px;background:#18745f;border-color:#18745f;color:white;box-shadow:0 3px 7px rgba(20,80,60,.12)}button.primary:hover{background:#115d4b;border-color:#115d4b}button:disabled{opacity:.6;cursor:wait}
.message{padding:18px;border-radius:10px;background:#fff8e9;border:1px solid #ead8a9;line-height:1.6;margin-bottom:18px;color:#654f25}.success{margin-top:20px;background:#f0f8f3;border-color:#c5dfce;color:#255b3c}.hidden,[hidden]{display:none!important}fieldset{min-width:0;margin:0;padding:0;border:0}footer{font-size:12px;line-height:1.5;color:#74847c;text-align:center;margin:28px 0 0}#receipt:focus,#recovery:focus{outline:none}#receiptDetails p{font-size:14px;margin-bottom:0}
@media(max-width:600px){main{margin:20px auto;padding:0 14px 28px}.card{padding:23px 20px;border-radius:13px;margin-bottom:14px}.form-header{padding:27px 20px 20px}.heading-row{align-items:flex-start;gap:13px}.form-icon{width:40px;height:48px;border-radius:11px}.form-icon svg{width:23px;height:29px}.eyebrow{font-size:9px;letter-spacing:.11em;margin-bottom:7px}h1{font-size:25px}.header-meta{gap:10px;margin-top:20px;padding-top:16px}.identity{flex-basis:100%;font-size:12px}.question-group{gap:22px}.section-heading{padding-bottom:14px}label{font-size:14px}.optional{white-space:nowrap}input[type=date]{max-width:100%}.submit-row{margin-top:20px}.submit-row button{width:100%}footer{font-size:11px}}
@media(prefers-reduced-motion:reduce){input,select,textarea,button{transition:none}}
</style></head><body>
<main>
<header class="card form-header"><div class="heading-row"><span class="form-icon" aria-hidden="true"><svg viewBox="0 0 28 34" fill="none"><rect x="4" y="2" width="20" height="30" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M11 6h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="14" cy="27.5" r="1" fill="currentColor"/></svg></span><div><p class="eyebrow">MUSKEGON AREA ISD</p><h1>iPad Screen Work Request</h1></div></div><div class="header-meta"><p id="identity" class="identity" role="status">Loading…</p></div></header>
<div id="message" class="message hidden" role="alert"></div>
<section id="recovery" class="card hidden" tabindex="-1"><h2>Check your submission</h2><p class="hint" id="recoveryText">The connection was interrupted. Check whether your request was received before submitting again.</p><div class="buttons"><button id="checkSave" type="button">Check submission</button><button id="cancelPending" class="hidden" type="button">Start again</button></div></section>
<form id="reportForm" class="hidden"><p class="required-note"><span class="required">*</span> Required</p><fieldset id="requestFields">
<section class="card question-group" aria-labelledby="staffHeading"><div class="section-heading"><h2 id="staffHeading">Name</h2></div>
<div class="field"><label for="staffName">Staff Name <span class="required">*</span></label><input id="staffName" required maxlength="120" autocomplete="name"></div>
<div class="field"><label for="school">School</label><input id="school" maxlength="160" autocomplete="off"></div>
<div class="field"><label for="reportedRoom">Classroom Number</label><input id="reportedRoom" maxlength="160" autocomplete="off"></div>
<div class="field"><label for="incidentDate">Date of damage or discovery</label><input id="incidentDate" type="date"></div>
</section>
<section class="card question-group" aria-labelledby="studentHeading"><div class="section-heading"><h2 id="studentHeading">Student Info</h2></div>
<div class="field"><label for="studentInvolved">Damaging Student's Name</label><input id="studentInvolved" maxlength="120" autocomplete="off"></div>
</section>
<section class="card question-group" aria-labelledby="deviceHeading"><div class="section-heading"><h2 id="deviceHeading">Device Info</h2></div>
<div class="field"><label for="assignedStudent">Assigned Student's Name</label><input id="assignedStudent" maxlength="120" autocomplete="off"></div>
<div class="field"><label for="summary">Summary (Description of what caused breakage) <span class="required">*</span></label><textarea id="summary" required maxlength="4000"></textarea></div>
<div class="field"><label for="serialNo">Serial Number</label><input id="serialNo" maxlength="100" autocomplete="off"></div>
<div class="field"><label for="additionalDetails">Anything else that seems important</label><textarea id="additionalDetails" maxlength="2000"></textarea></div>
</section>
<div class="buttons submit-row"><button class="primary" type="submit" id="submitReport">Submit</button></div>
</fieldset></form>
<section class="card hidden" id="receipt" tabindex="-1"><h2>Your request has been submitted.</h2><div id="receiptDetails" class="message success"></div><button id="newReport" type="button">Submit another request</button></section>
<footer>Muskegon Area ISD · Technology Support</footer>
</main>
<script>
'use strict';
var FORM={email:'',name:'',locations:[],defaults:{},payload:null,busy:false,nonce:null};
function el(id){return document.getElementById(id);}
function show(id,on){el(id).classList.toggle('hidden',!on);}
function textNode(tag,text){var n=document.createElement(tag);n.textContent=text;return n;}
function message(text){el('message').textContent=text||'';show('message',!!text);}
function call(name){var args=Array.prototype.slice.call(arguments,1);return new Promise(function(resolve,reject){var r=MAISD_API.runner.withSuccessHandler(function(result){if(!result||!result.ok){var e=new Error(result&&result.error||'No response from the server.');e.definite=!!result&&result.code!=='SAVE_UNCERTAIN';reject(e);}else resolve(result.data);}).withFailureHandler(function(){reject(new Error('The connection was interrupted. Check whether your request was received before submitting again.'));});r[name].apply(r,args);});}
function storageKey(){return 'maisd.repair.pending.'+FORM.email;}
function getPending(){try{return sessionStorage.getItem(storageKey());}catch(e){return FORM.nonce;}}
function setPending(value){FORM.nonce=value;try{if(value)sessionStorage.setItem(storageKey(),value);else sessionStorage.removeItem(storageKey());}catch(e){}}
function setBusy(on){FORM.busy=on;el('requestFields').disabled=on;}
function collect(){return {StaffName:el('staffName').value.trim(),School:el('school').value.trim(),Room:el('reportedRoom').value.trim(),IncidentDate:el('incidentDate').value,StudentInvolved:el('studentInvolved').value.trim(),AssignedStudent:el('assignedStudent').value.trim(),Summary:el('summary').value.trim(),SerialNo:el('serialNo').value.trim(),AdditionalDetails:el('additionalDetails').value.trim()};}
function receipt(r){message('');setPending(null);setBusy(false);show('recovery',false);show('reportForm',false);show('receipt',true);el('receiptDetails').replaceChildren(textNode('strong','Request '+r.ticketId),textNode('p','Submitted '+r.submittedOn));el('receipt').focus();}
function recover(){show('reportForm',false);show('recovery',true);show('cancelPending',false);el('recovery').focus();}
function submitReport(event){if(event)event.preventDefault();if(FORM.busy)return;message('');if(getPending()){recover();checkSave();return;}if(!el('reportForm').reportValidity())return;FORM.payload=collect();setBusy(true);var nonce='form_'+crypto.randomUUID();setPending(nonce);el('submitReport').textContent='Submitting…';call('apiRepairSubmit',FORM.payload,nonce).then(receipt).catch(function(e){if(e.definite){setPending(null);setBusy(false);message(e.message);show('reportForm',true);}else{recover();message(e.message);}}).finally(function(){el('submitReport').textContent='Submit';});}
function checkSave(){var nonce=getPending();if(!nonce)return;el('checkSave').disabled=true;call('apiRepairSaveStatus',nonce).then(function(d){if(d.state==='Saved')return receipt(d.receipt);if(d.state==='Not applied'){setPending(null);setBusy(false);show('recovery',false);show('reportForm',true);message('Your request was not received. Please submit it again.');return;}el('recoveryText').textContent=d.state==='Needs review'?'Technology Support needs to check this submission. Please do not submit another copy.':'No saved request was found. Choose Start again to return to the form.';show('cancelPending',d.state==='Not recorded');}).catch(function(e){message(e.message);}).finally(function(){el('checkSave').disabled=false;});}
function cancelPending(){el('cancelPending').disabled=true;call('apiRepairCancelPending',getPending()).then(function(d){if(d.state==='Saved')return checkSave();setPending(null);setBusy(false);show('recovery',false);show('reportForm',true);message('Your request was not received. Please submit it again.');}).catch(function(e){message(e.message);}).finally(function(){el('cancelPending').disabled=false;});}
function newReport(){el('reportForm').reset();FORM.payload=null;el('staffName').value=FORM.name;show('receipt',false);show('reportForm',true);message('');el('staffName').focus();}
el('reportForm').onsubmit=submitReport;el('newReport').onclick=newReport;el('checkSave').onclick=checkSave;el('cancelPending').onclick=cancelPending;
call('apiRepairFormBoot').then(function(d){FORM.email=d.email;FORM.name=d.name;FORM.defaults=d.defaults||{};FORM.locations=d.locations;el('identity').textContent=d.email;el('staffName').value=d.name;el('incidentDate').max=d.today;if(getPending()){recover();checkSave();}else show('reportForm',true);}).catch(function(e){el('identity').textContent='Unable to open the form';message(e.message);});
</script></body></html>
